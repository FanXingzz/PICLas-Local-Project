N = 1
MeshFile = helium_mesh.h5
ProjectName = helium_pulse
doPrintStatusLine = F
ManualTimeStep = 2.5e-14
tend = 1.275e-09
Analyze_dt = 5e-12
IterDisplayStep = 1000
PulsePeak = 6000
PulseRise = 2e-09
PulseFlat = 5e-09
PulseFall = 2e-09

TrackingMethod = triatracking
Part-nBounds = 6
Part-Boundary1-SourceName = BC_HV
Part-Boundary1-Condition = reflective
Part-Boundary2-SourceName = BC_Ground
Part-Boundary2-Condition = reflective
Part-Boundary3-SourceName = BC_Quartz
Part-Boundary3-Condition = reflective
Part-Boundary3-Dielectric = T
Part-Boundary4-SourceName = BC_Outer
Part-Boundary4-Condition = open

DoDielectric = T
DielectricNoParticles = T
DielectricNbrOfZones = 1
DielectricZoneID = (/2/)
DielectricZoneEpsR = (/ 3.8 /)
DielectricZoneMuR = (/1.0/)

IniExactFunc = 0
epsCG = 1.e-8
maxIterCG = 10000
PrecondType = 10
PIC-DoInterpolation = T
PIC-Interpolation-Type = particle_position
PIC-Deposition-Type = cell_volweight_mean
PIC-OutputSource = T
Particles-HaloEpsVelo = 3.e7

Part-nSpecies = 6
Part-vMPF = T
Part-Species2-vMPFMergeThreshold = 100
Part-Species3-vMPFMergeThreshold = 100

Part-Species1-MacroParticleFactor = 20
Part-Species1-nInits = 1
Part-Species1-Init1-SpaceIC = background
Part-Species1-Init1-velocityDistribution = maxwell_lpn
Part-Species1-Init1-PartDensity = 2.4627315e+25
Part-Species1-Init1-VeloIC = 0.
Part-Species1-Init1-VeloVecIC = (/1.,0.,0./)
Part-Species1-Init1-MWTemperatureIC = 298
Part-Species1-Init1-TempElec = 298.

! Jia initial densities: electron 2e13, He+ and He2+ each 1e13 m^-3.
Part-Species2-MacroParticleFactor = 0.07502238305331517
Part-Species2-nInits = 1
Part-Species2-Init1-SpaceIC = cylinder
Part-Species2-Init1-ParticleNumber = 1024
Part-Species2-Init1-BasePointIC = (/-0.000499,0.,0./)
Part-Species2-Init1-BaseVector1IC = (/0.,1.,0./)
Part-Species2-Init1-BaseVector2IC = (/0.,0.,1./)
Part-Species2-Init1-NormalIC = (/1.,0.,0./)
Part-Species2-Init1-velocityDistribution = maxwell_lpn
Part-Species2-Init1-MWTemperatureIC = 298.
Part-Species2-Init1-TempElec = 298.
Part-Species3-MacroParticleFactor = 0.07502238305331517
Part-Species3-nInits = 1
Part-Species3-Init1-SpaceIC = cylinder
Part-Species3-Init1-ParticleNumber = 2048
Part-Species3-Init1-BasePointIC = (/-0.000499,0.,0./)
Part-Species3-Init1-BaseVector1IC = (/0.,1.,0./)
Part-Species3-Init1-BaseVector2IC = (/0.,0.,1./)
Part-Species3-Init1-NormalIC = (/1.,0.,0./)
Part-Species3-Init1-velocityDistribution = maxwell_lpn
Part-Species3-Init1-MWTemperatureIC = 11604.51812

UseDSMC = T
Particles-DSMC-CollisMode = 3
Particles-DSMC-ElectronicModel = 3
Particles-DSMCElectronicDatabase = Electronic-State-Database.h5
Particles-CollXSec-Database = XSec_Database_He_Plasma.h5
Particles-CollXSec-NullCollision = T
Part-Species1-UseElecXSec = T
Part-Species2-UseCollXSec = T
Part-Species3-UseCollXSec = T
DSMC-NumOfReactions = 1
DSMC-Reaction1-ReactionModel = XSec
DSMC-Reaction1-Reactants = (/1,3,0/)
DSMC-Reaction1-Products = (/2,3,3,0/)

CalcNumDens = T
CalcNumSpec = T
CalcCharge = T
CalcPotentialEnergy = T
CalcKineticEnergy = T
CalcElectronTemperature = T
CalcDebyeLength = T
CalcPlasmaFrequency = T
CalcPICTimeStep = T
CalcPointsPerDebyeLength = T
CalcElectricTimeDerivative = T
CalcBoundaryFieldOutput = T
BFO-NFieldBoundaries = 2
BFO-FieldBoundaries = (/1,2/)
CalcBoundaryParticleOutput = T
BPO-NPartBoundaries = 3
BPO-PartBoundaries = (/1,2,3/)
BPO-NSpecies = 5
BPO-Species = (/2,3,4,5,6/)
TimeStampLength = 18
Part-NumberOfRandomSeeds = 2
Particles-RandomSeed1 = 1
Particles-RandomSeed2 = 2

NVisu = 2
VisuParticles = F

! Particle lookup bins (independent of the field mesh)
Part-FIBGMdeltas = (/1.2e-5,5e-6,1e-6/)

Particles-Symmetry-Order = 2
Particles-Symmetry2DAxisymmetric = T
Part-Boundary5-SourceName = BC_Axis
Part-Boundary5-Condition = symmetric_axis
Part-Boundary6-SourceName = BC_Sym
Part-Boundary6-Condition = symmetric_dim

Part-Species2-Init1-RadiusIC = 4.95e-05

Part-Species2-Init1-Radius2IC = 0.

Part-Species2-Init1-CylinderHeightIC = 0.000998

Part-Species3-Init1-RadiusIC = 4.95e-05

Part-Species3-Init1-Radius2IC = 0.

Part-Species3-Init1-CylinderHeightIC = 0.000998

! Tungsten effective electrode model; see MODEL_SETTINGS.md.
Part-Boundary1-SurfaceModel = 7
Part-Boundary1-WallTemp = 298.
Part-Boundary1-MomentumACC = 0.
Part-Boundary1-SurfModEmissionYield = 0.25
Part-Boundary1-SurfModEnergyDistribution = uniform-energy
Part-Boundary1-SurfModEmissionEnergy = 4.
Part-Boundary1-SurfModElectronReflection = 0.2
Part-Species2-PartBound1-ResultSpec = 3
Part-Boundary2-SurfaceModel = 7
Part-Boundary2-WallTemp = 298.
Part-Boundary2-MomentumACC = 0.
Part-Boundary2-SurfModEmissionYield = 0.25
Part-Boundary2-SurfModEnergyDistribution = uniform-energy
Part-Boundary2-SurfModEmissionEnergy = 4.
Part-Boundary2-SurfModElectronReflection = 0.2
Part-Species2-PartBound2-ResultSpec = 3
CalcCurrentSEE = T

! Jia gas chemistry includes the He+ association channel R16.
Particles-JiaChemistry = T
Part-Species4-MacroParticleFactor = 0.07502238305331517
Part-Species4-nInits = 1
Part-Species4-UseCollXSec = T
Part-Species4-vMPFMergeThreshold = 100
Particles-He2-MetalYield = 0.1
Part-Species4-PartBound1-ResultSpec = 3
Part-Species4-PartBound2-ResultSpec = 3

! He* and He2* seeds: mole fraction 1e-11 each within the existing cylindrical seed region.
Part-Species5-MacroParticleFactor = 7.390399438018616
Part-Species5-vMPFMergeThreshold = 100
Part-Species5-nInits = 1
Part-Species5-Init1-SpaceIC = cylinder
Part-Species5-Init1-ParticleNumber = 256
Part-Species5-Init1-BasePointIC = (/-0.000499,0.,0./)
Part-Species5-Init1-BaseVector1IC = (/0.,1.,0./)
Part-Species5-Init1-BaseVector2IC = (/0.,0.,1./)
Part-Species5-Init1-NormalIC = (/1.,0.,0./)
Part-Species5-Init1-velocityDistribution = maxwell_lpn
Part-Species5-Init1-MWTemperatureIC = 298.
Part-Species5-Init1-TempElec = 298.
Part-Species5-Init1-RadiusIC = 4.95e-05
Part-Species5-Init1-Radius2IC = 0.
Part-Species5-Init1-CylinderHeightIC = 0.000998
Part-Species6-MacroParticleFactor = 7.390399438018616
Part-Species6-vMPFMergeThreshold = 100
Part-Species6-nInits = 1
Part-Species6-Init1-SpaceIC = cylinder
Part-Species6-Init1-ParticleNumber = 256
Part-Species6-Init1-BasePointIC = (/-0.000499,0.,0./)
Part-Species6-Init1-BaseVector1IC = (/0.,1.,0./)
Part-Species6-Init1-BaseVector2IC = (/0.,0.,1./)
Part-Species6-Init1-NormalIC = (/1.,0.,0./)
Part-Species6-Init1-velocityDistribution = maxwell_lpn
Part-Species6-Init1-MWTemperatureIC = 298.
Part-Species6-Init1-TempElec = 298.
Part-Species6-Init1-RadiusIC = 4.95e-05
Part-Species6-Init1-Radius2IC = 0.
Part-Species6-Init1-CylinderHeightIC = 0.000998

! Metastables are quenched at tungsten and quartz; ground state products return to the gas reservoir.

! He2+ uses the same cylinder and ion temperature as He+.
Part-Species4-Init1-SpaceIC = cylinder
Part-Species4-Init1-ParticleNumber = 1024
Part-Species4-Init1-BasePointIC = (/-0.000499,0.,0./)
Part-Species4-Init1-BaseVector1IC = (/0.,1.,0./)
Part-Species4-Init1-BaseVector2IC = (/0.,0.,1./)
Part-Species4-Init1-NormalIC = (/1.,0.,0./)
Part-Species4-Init1-velocityDistribution = maxwell_lpn
Part-Species4-Init1-MWTemperatureIC = 298.
Part-Species4-Init1-TempElec = 298.
Part-Species4-Init1-RadiusIC = 4.95e-05
Part-Species4-Init1-Radius2IC = 0.
Part-Species4-Init1-CylinderHeightIC = 0.000998

! Quartz ion-induced SEE. Incoming electrons are absorbed, and both metastables are quenched.
Part-Boundary3-SurfaceModel = 7
Part-Boundary3-SurfModEmissionYield = 0.02
Particles-He2-QuartzYield = 0.02
Part-Boundary3-SurfModElectronReflection = 0.
Part-Boundary3-WallTemp = 298.
Part-Boundary3-MomentumACC = 0.
Part-Boundary3-SurfModEnergyDistribution = uniform-energy
Part-Boundary3-SurfModEmissionEnergy = 4.
Part-Species2-PartBound3-ResultSpec = 3
Part-Species4-PartBound3-ResultSpec = 3

! Restart benchmark
DoLoadBalance = T
UseH5IOLoadBalance = T
PartWeightLoadBalance = F
LoadBalanceSample = 100
LoadBalanceMaxSteps = 4
Load-DeviationThreshold = 0.10
